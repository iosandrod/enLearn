<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>打印数据源连接表单验证</title></head>
<body><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import { install as installVxeUI } from 'vxe-pc-ui';
import VxeUITable from 'vxe-table';
import 'vxe-pc-ui/lib/style.css';
import 'vxe-table/lib/style.css';
import 'remixicon/fonts/remixicon.css';
import '../../packages/tldraw-vue/src/styles.css';
import PrintDataSourceManager from '../../packages/tldraw-vue/src/components/PrintDataSourceManager.vue';
import GlobalDialogHost from '../../packages/lowcode-framework/src/components/GlobalDialogHost';
import { lowCodeHostKey } from '../../packages/lowcode-framework/src/core/host';
import { initializeLowCodeMaterialCatalog } from '../../packages/lowcode-framework/src/lowcode/material-runtime/catalog';
const serviceApi = { invoke: (...args) => window.testService(...args) };
await initializeLowCodeMaterialCatalog(serviceApi);
const app = createApp({ render: () => h('div', [h(PrintDataSourceManager, { serviceApi }), h(GlobalDialogHost)]) });
app.provide(lowCodeHostKey, { serviceApi });
app.use(installVxeUI);
app.use(VxeUITable);
app.mount('#app');
</script></body></html>
