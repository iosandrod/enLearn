<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime button designer persistence smoke</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #result {
        position: fixed;
        z-index: -1;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <output id="result">pending</output>
    <script type="module">
      import { createApp, defineComponent, h, nextTick, reactive } from 'vue';
      import { install as installVxeUI } from 'vxe-pc-ui';
      import VxeUITable from 'vxe-table';
      import 'remixicon/fonts/remixicon.css';
      import 'vxe-pc-ui/lib/style.css';
      import 'vxe-table/lib/style.css';
      import '../assets/styles/app.css';
      import '../assets/styles/visual-editor-utilities.scss';
      import LowCodePageRenderer from '../../packages/lowcode-framework/src/components/LowCodePageRenderer.vue';

      const pageType = new URLSearchParams(location.search).get('pageType') === 'edit'
        ? 'edit'
        : 'list';
      const recordId = new URLSearchParams(location.search).get('recordId') || '';
      const saveCalls = [];
      const routerPushes = [];
      const pageRecord = reactive({
        id: 'runtime-button-save-page',
        code: 'runtime-button-save',
        route: '/runtime-button-save',
        title: '运行时按钮保存',
        description: null,
        layout: 'dashboard',
        status: 'published',
        keep_alive: false,
        page_type: pageType,
        edit_page_id: null,
        schema: {
          schemaVersion: 3,
          code: 'runtime-button-save',
          route: '/runtime-button-save',
          title: '运行时按钮保存',
          pageType,
          layout: 'dashboard',
          status: 'published',
          keepAlive: false,
          dataSources: {},
          blocks: [
            {
              id: 'records-actions',
              kind: 'buttonGroup',
              title: '记录操作',
              align: 'left',
              gap: 8,
              actions: [
                {
                  code: 'create',
                  label: '新增',
                  status: 'primary',
                  type: 'button',
                  eventName: 'buttonGroup.create',
                  script: '',
                },
              ],
            },
          ],
          overlays: [],
        },
        version: 1,
        published_at: null,
        created_at: '',
        updated_at: '',
      });
      const serviceApi = {
        async invoke(serviceName, serviceMethod, payload = {}) {
          if (serviceName === 'lowcode' && serviceMethod === 'listItems') {
            if (payload.resource === 'lowcode_form_definitions') {
              return [{
                code: 'button-group-designer',
                schema: {
                  columns: 1,
                  fields: [
                    {
                      field: 'button-group-designer-buttons-form',
                      label: '按钮配置',
                      component: 'lc-sub-form',
                      showTitle: false,
                      props: {
                        schema: {
                          columns: 1,
                          fields: [{
                            field: 'buttons',
                            label: '按钮配置',
                            component: 'lc-array-table',
                            span: 24,
                            props: {
                              height: '100%',
                              toolbarButtons: [
                                { code: 'add', label: '新增按钮', status: 'primary' },
                                { code: 'add-dropdown', label: '新增下拉按钮', status: 'primary' },
                                { code: 'select-default', label: '选择默认按钮', status: 'primary', prefixIcon: 'ri-list-check-3' },
                              ],
                              toolbarAlign: 'left',
                              rowKey: '__id',
                              preserveRowKey: true,
                              treeConfig: { childrenField: 'children', expandAll: true },
                              minRows: 1,
                              childAddable: true,
                              movable: true,
                              copyable: true,
                              removable: true,
                              columns: [
                                { field: 'label', title: '按钮名称', component: 'vxe-input' },
                                { field: 'code', title: '编码 code', component: 'vxe-input' },
                                { field: 'script', title: '执行脚本', component: 'lc-monaco-editor', props: { dialog: true, language: 'javascript' } },
                              ],
                            },
                          }],
                          actions: [],
                        },
                      },
                    },
                    {
                      field: 'button-group-designer-info-form',
                      label: '组件信息',
                      component: 'lc-sub-form',
                      showTitle: false,
                      props: {
                        schema: {
                          columns: 2,
                          fields: [
                            { field: 'blockId', label: 'Block ID', component: 'vxe-input' },
                            { field: 'title', label: '标题', component: 'vxe-input' },
                            { field: 'description', label: '描述', component: 'vxe-input' },
                            { field: 'align', label: '对齐方式', component: 'vxe-input' },
                            { field: 'gap', label: '按钮间距', component: 'vxe-input' },
                          ],
                          actions: [],
                        },
                      },
                    },
                  ],
                  layout: [{
                    kind: 'tabs',
                    defaultKey: 'buttons',
                    tabs: [
                      { key: 'buttons', label: '按钮设计', blocks: [{ kind: 'field', field: 'button-group-designer-buttons-form' }] },
                      { key: 'info', label: '组件信息', blocks: [{ kind: 'field', field: 'button-group-designer-info-form' }] },
                    ],
                  }],
                  actions: [],
                },
              }];
            }
            return [{
              id: 'runtime-button-save-edit-page',
              code: 'runtime-button-save-edit',
              route: '/runtime-button-save/edit',
            }];
          }
          if (serviceName !== 'lowcode' || serviceMethod !== 'saveItem') {
            throw new Error(`Unexpected service call: ${serviceName}.${serviceMethod}`);
          }

          saveCalls.push(structuredClone(payload));
          return {
            ...pageRecord,
            ...payload.data,
            schema: structuredClone(payload.data.schema),
          };
        },
      };
      const router = {
        async push(target) {
          routerPushes.push(target);
          return target;
        },
      };

      const App = defineComponent({
        setup() {
          return () => h(LowCodePageRenderer, {
            page: pageRecord,
            serviceApi,
            router,
            locale: 'zh-CN',
            route: {
              query: recordId ? { id: recordId } : {},
              params: {},
              path: pageRecord.route,
              fullPath: pageRecord.route,
            },
          });
        },
      });

      const app = createApp(App);
      app.use(installVxeUI);
      app.use(VxeUITable);
      app.mount('#app');

      window.__buttonGroupRuntimeSaveSmoke = {
        pageRecord,
        saveCalls,
        routerPushes,
      };

      await nextTick();
      document.querySelector('#result').textContent = JSON.stringify({ ok: true });
    </script>
  </body>
</html>
