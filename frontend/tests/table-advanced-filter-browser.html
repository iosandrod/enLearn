<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table advanced filter smoke</title>
    <style>
      html,
      body,
      #app {
        min-width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        color: #202124;
        background: #f5f7fa;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      #app {
        box-sizing: border-box;
        padding: 24px;
      }

      .smoke-shell {
        width: min(1420px, calc(100vw - 48px));
        margin: 0 auto;
      }

      .smoke-title {
        margin: 0 0 16px;
        font-size: 20px;
        letter-spacing: 0;
      }

      .smoke-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .smoke-toolbar button {
        height: 32px;
        padding: 0 12px;
        border: 1px solid #d7dbe2;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      #result {
        position: fixed;
        z-index: -1;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }

      @media (max-width: 640px) {
        #app {
          padding: 12px;
        }

        .smoke-shell {
          width: calc(100vw - 24px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <output id="result">pending</output>
    <script type="module">
      import { createApp, defineComponent, h, nextTick, reactive, ref } from 'vue';
      import { install as installVxeUI } from 'vxe-pc-ui';
      import VxeUITable, { VxeColumn, VxeGrid, VxeTable, VxeUI } from 'vxe-table';
      import AdvancedFilterPlugin, { prepareAdvancedFilterColumns } from 'vxe-table-plugin-advanced-filter';
      import 'remixicon/fonts/remixicon.css';
      import 'vxe-pc-ui/lib/style.css';
      import 'vxe-table/lib/style.css';
      import 'vxe-table-plugin-advanced-filter/style.css';

      VxeUI.use(AdvancedFilterPlugin, {
        autoEnable: true,
        caseSensitive: false,
        emptyLabel: '暂无',
        maxVisibleOptions: 500,
      });

      const initialRows = [
        { id: 1, name: '非主流昵称', job: '前端开发工程师', role: 'Designer', gender: 'Man', age: 28, score: 72, rating: 4.2, joinDate: '2026-08-01', enabled: true, address: '北京市朝阳区33号' },
        { id: 2, name: '使用说明', job: '产品经理', role: 'Test', gender: 'Women', age: 22, score: 90, rating: 4.8, joinDate: '2026-08-02', enabled: false, address: '广州市白云区964号' },
        { id: 3, name: '自定义的', job: '测试工程师', role: 'Develop', gender: 'Man', age: 32, score: 66, rating: 3.5, joinDate: '2026-08-03', enabled: true, address: '深圳市龙华区94号' },
        { id: 4, name: '一直风吹过', job: '后端开发工程师', role: 'PM', gender: 'Women', age: 23, score: 77, rating: 4.1, joinDate: '2026-08-04', enabled: false, address: '广州市白云区15号' },
        { id: 5, name: null, job: '运维工程师', role: 'Designer', gender: 'Man', age: 30, score: 100, rating: 4.9, joinDate: '2026-08-05', enabled: true, address: '北京市朝阳区32号' },
        { id: 6, name: '使用说明', job: '前端开发工程师', role: 'Develop', gender: 'Women', age: 35, score: 92, rating: 4.6, joinDate: '2026-08-06', enabled: true, address: '深圳市罗湖区94号' },
        { id: 7, name: '非主流昵称', job: '产品经理', role: 'PM', gender: 'Man', age: 27, score: 85, rating: 4.3, joinDate: '2026-08-07', enabled: false, address: '上海市黄浦区44号' },
        { id: 8, name: '自定义的', job: '测试工程师', role: 'Test', gender: 'Women', age: 29, score: 61, rating: 3.7, joinDate: '2026-08-08', enabled: true, address: '上海市虹口区44号' },
        { id: 9, name: '一直风吹过', job: '后端开发工程师', role: 'Develop', gender: 'Man', age: 31, score: 88, rating: 4.5, joinDate: '2026-08-09', enabled: true, address: '深圳市龙岗区94号' },
      ];

      const columns = prepareAdvancedFilterColumns([
        { type: 'seq', title: '序号', width: 72, fixed: 'left' },
        { field: 'name', title: '名称', minWidth: 150 },
        { field: 'job', title: '职位', minWidth: 170 },
        { field: 'role', title: '角色', minWidth: 120 },
        { field: 'gender', title: '性别', minWidth: 100 },
        { field: 'age', title: '年龄', width: 90, params: { advancedFilter: { dataType: 'number' } } },
        { field: 'score', title: '分数', width: 100, params: { advancedFilter: { dataType: 'number' } } },
        { field: 'rating', title: '评分', width: 100, params: { advancedFilter: { dataType: 'number' } } },
        { field: 'joinDate', title: '入职日期', width: 130, params: { advancedFilter: { dataType: 'date' } } },
        { field: 'enabled', title: '启用', width: 90, params: { advancedFilter: { dataType: 'boolean' } } },
        { field: 'address', title: '地址', minWidth: 210 },
        { title: '操作', width: 110, slots: { default: 'actions' } },
      ], { autoEnable: true });

      const rows = reactive(initialRows.map((row) => ({ ...row })));
      const gridRef = ref();
      const fallbackTableRef = ref();
      const fallbackRows = reactive([
        { id: 1, fallbackName: 'Alpha', amount: 10 },
        { id: 2, fallbackName: 'Beta', amount: 20 },
        { id: 3, fallbackName: 'Gamma', amount: 30 },
      ]);

      const App = defineComponent({
        setup() {
          const addRow = async () => {
            rows.push({
              id: rows.length + 1,
              name: '新增候选值',
              job: '数据工程师',
              role: 'Develop',
              gender: 'Women',
              age: 26,
              score: 95,
              rating: 4.7,
              joinDate: '2026-08-14',
              enabled: true,
              address: '杭州市西湖区14号',
            });
            await nextTick();
            await gridRef.value?.refreshAdvancedFilterValues('name');
          };

          window.__advancedFilterSmoke = {
            rows,
            columns,
            gridRef,
            fallbackTableRef,
            addRow,
          };

          return () => h('main', { class: 'smoke-shell' }, [
            h('h1', { class: 'smoke-title' }, '表格本地高级筛选'),
            h('div', { class: 'smoke-toolbar' }, [
              h('button', { id: 'add-row', type: 'button', onClick: addRow }, '新增一行'),
              h('button', {
                id: 'clear-all',
                type: 'button',
                onClick: () => gridRef.value?.clearAdvancedFilter(),
              }, '清除全部筛选'),
            ]),
            h(VxeGrid, {
              ref: gridRef,
              id: 'advanced-filter-grid',
              border: true,
              stripe: true,
              height: 560,
              data: rows,
              columns,
              params: { advancedFilter: true },
              filterConfig: { remote: false, transfer: true },
              sortConfig: { remote: false, multiple: false },
              columnConfig: { resizable: true, maxFixedSize: 6 },
              showOverflow: 'tooltip',
            }, {
              actions: ({ row }) => h('button', {
                type: 'button',
                'data-row-id': row.id,
              }, '查看'),
            }),
            h('h2', { class: 'smoke-title', style: { marginTop: '24px' } }, '原生表格自动接入'),
            h(VxeTable, {
              ref: fallbackTableRef,
              id: 'fallback-vxe-table',
              border: true,
              height: 240,
              data: fallbackRows,
              params: { advancedFilter: true },
              filterConfig: { remote: false, transfer: true },
              sortConfig: { remote: false },
            }, {
              default: () => [
                h(VxeColumn, { type: 'seq', title: '原生序号', width: 90 }),
                h(VxeColumn, { field: 'fallbackName', title: '原生名称', minWidth: 160 }),
                h(VxeColumn, {
                  field: 'amount',
                  title: '原生金额',
                  minWidth: 140,
                  params: { advancedFilter: { dataType: 'number' } },
                }),
                h(VxeColumn, { title: '原生操作', width: 120 }, {
                  default: ({ row }) => h('button', { type: 'button' }, `查看 ${row.id}`),
                }),
              ],
            }),
          ]);
        },
      });

      const app = createApp(App);
      app.use(installVxeUI);
      app.use(VxeUITable);
      app.mount('#app');
      await nextTick();
      document.querySelector('#result').textContent = JSON.stringify({ ok: true });
    </script>
  </body>
</html>
