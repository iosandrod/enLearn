<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime form designer save smoke</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #app {
        padding: 24px;
        box-sizing: border-box;
      }

      #result {
        position: fixed;
        z-index: -1;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <output id="result">pending</output>
    <script type="module">
      import { createApp, defineComponent, h, nextTick, reactive, ref } from 'vue';
      import { install as installVxeUI } from 'vxe-pc-ui';
      import VxeUITable from 'vxe-table';
      import 'remixicon/fonts/remixicon.css';
      import 'vxe-pc-ui/lib/style.css';
      import 'vxe-table/lib/style.css';
      import '../assets/styles/app.css';
      import '../assets/styles/visual-editor-utilities.scss';
      import LowCodePageRenderer from '../../packages/lowcode-framework/src/components/LowCodePageRenderer.vue';
      import { lowCodeOptionSourceRegistry } from '../../packages/lowcode-framework/src/runtime/option-source-registry';

      const useReactivePage = new URLSearchParams(location.search).get('page') === 'reactive';
      const runtimeMode = new URLSearchParams(location.search).get('mode') === 'edit'
        ? 'edit'
        : 'create';
      const renderer = ref(null);
      const saveCalls = [];
      lowCodeOptionSourceRegistry.invalidate();
      const initialPageRecord = {
        id: `runtime-form-designer-save-${useReactivePage ? 'reactive' : 'plain'}`,
        code: 'runtime-form-designer-save',
        route: '/runtime-form-designer-save',
        title: '运行时表单设计保存',
        description: null,
        layout: 'dashboard',
        status: 'published',
        keep_alive: false,
        page_type: 'edit',
        edit_page_id: null,
        schema: {
          schemaVersion: 3,
          code: 'runtime-form-designer-save',
          route: '/runtime-form-designer-save',
          title: '运行时表单设计保存',
          pageType: 'edit',
          layout: 'dashboard',
          status: 'published',
          keepAlive: false,
          scriptPolicy: {
            capabilities: ['form.patch'],
          },
          dataSources: {},
          blocks: [
            {
              id: 'runtime-edit-form',
              kind: 'form',
              title: '编辑表单',
              initialValues: {
                name: '初始姓名',
                code: 'INIT-001',
              },
              schema: {
                columns: 2,
                fields: [
                  {
                    field: 'name',
                    label: '姓名',
                    component: 'vxe-input',
                    props: { placeholder: '请输入姓名' },
                  },
                  {
                    field: 'code',
                    label: '编码',
                    component: 'vxe-input',
                    props: { placeholder: '请输入编码' },
                  },
                  {
                    field: 'createLocked',
                    label: '新增禁用示例',
                    component: 'vxe-input',
                    createDisabled: true,
                  },
                  {
                    field: 'editLocked',
                    label: '编辑禁用示例',
                    component: 'vxe-input',
                    editDisabled: true,
                  },
                  {
                    field: 'generatedCode',
                    label: '函数默认编码',
                    component: 'vxe-input',
                    defaultValueType: 'function',
                    defaultValueScript: `
                      async function main(event) {
                        return "AUTO-" + event.blockKind + "-" + event.field;
                      }
                    `,
                  },
                  {
                    field: 'updateSource',
                    label: '更新源',
                    component: 'vxe-input',
                    updateScript: `
                      async function main(event) {
                        await this.$form.patch(event.blockId, {
                          updateTarget: "PATCHED-" + event.value,
                        });
                      }
                    `,
                  },
                  {
                    field: 'updateTarget',
                    label: '更新目标',
                    component: 'vxe-input',
                  },
                  {
                    field: 'validationValue',
                    label: '脚本校验值',
                    component: 'vxe-input',
                    validationMessage: '配置的校验提示',
                    validationScript: `
                      async function main(event) {
                        if (event.value === "valid") return true;
                        if (event.value === "message") return "函数返回的校验提示";
                        throw new Error("函数抛出的校验提示");
                      }
                    `,
                  },
                  {
                    field: 'relatedItem',
                    label: '关联物料',
                    component: 'base-info',
                    props: {
                      clearable: true,
                      relateInfoConfig: {
                        sourceType: 'entity',
                        entityCode: 'planning_item',
                        tableName: 'planning_item',
                        resource: 'planning_item',
                        serviceName: 'planning',
                        serviceMethod: 'listItems',
                        valueField: 'id',
                        displayField: 'name',
                        displayValueField: 'relatedItem_label',
                        fieldMappings: [
                          { sourceField: 'id', targetField: 'relatedItem' },
                          { sourceField: 'name', targetField: 'relatedItemName' },
                        ],
                      },
                    },
                  },
                ],
                actions: [
                  {
                    code: 'validate',
                    label: '执行校验',
                    type: 'submit',
                  },
                ],
              },
            },
            {
              id: 'runtime-search-form',
              kind: 'searchForm',
              title: '查询表单',
              initialValues: {
                keyword: '初始关键字',
              },
              schema: {
                fields: [
                  {
                    field: 'keyword',
                    label: '关键字',
                    component: 'vxe-input',
                    props: { placeholder: '请输入关键字' },
                  },
                ],
                actions: [],
              },
            },
          ],
          overlays: [],
        },
        version: 1,
        published_at: null,
        created_at: '',
        updated_at: '',
      };
      const pageRecord = useReactivePage ? reactive(initialPageRecord) : initialPageRecord;
      const serviceApi = {
        async invoke(serviceName, serviceMethod, payload = {}) {
          if (serviceName === 'lowcode' && serviceMethod === 'listItems') {
            if (payload.resource === 'lowcode_form_definitions') {
              const requestedCode = Array.isArray(payload.filters?.code)
                ? payload.filters.code[0]
                : payload.filters?.code;
              if (requestedCode === 'runtime-form-field-editor') {
                return [{
                  code: 'runtime-form-field-editor',
                  name: '运行时字段属性编辑',
                  enabled: true,
                  schema: {
                    columns: 2,
                    fields: [
                      { field: 'field', label: '字段编码', component: 'vxe-input', props: { readonly: true } },
                      { field: 'label', label: '字段名称', component: 'vxe-input' },
                      {
                        field: 'component',
                        label: '组件类型',
                        component: 'vxe-select',
                        optionsCode: 'form_field_component_type',
                        props: { clearable: false, filterable: true },
                      },
                      { field: 'required', label: '必须录入', component: 'vxe-switch' },
                      { field: 'requiredMessage', label: '必录提示', component: 'vxe-input' },
                      { field: 'createDisabled', label: '新增禁用', component: 'vxe-switch' },
                      { field: 'editDisabled', label: '编辑禁用', component: 'vxe-switch' },
                      {
                        field: 'relateInfoConfig',
                        label: '关联资料配置',
                        component: 'lc-sub-form',
                        span: 2,
                        props: {
                          columns: 2,
                          padding: false,
                          schema: {
                            columns: 2,
                            fields: [
                              {
                                field: 'sourceType',
                                label: '来源类型',
                                component: 'vxe-select',
                                options: [
                                  { label: '实体/表/视图', value: 'entity' },
                                  { label: '低代码页面', value: 'lowcode_page' },
                                ],
                              },
                              { field: 'entityCode', label: '实体编码', component: 'vxe-input' },
                              { field: 'tableName', label: '表名/视图名', component: 'vxe-input' },
                              { field: 'resource', label: '业务资源', component: 'vxe-input' },
                              { field: 'pageCode', label: '页面编码', component: 'vxe-input' },
                              { field: 'sourceKey', label: '页面数据源', component: 'vxe-input' },
                              { field: 'serviceName', label: '服务名称', component: 'vxe-input' },
                              { field: 'serviceMethod', label: '服务方法', component: 'vxe-input' },
                              { field: 'valueField', label: '值字段', component: 'vxe-input' },
                              { field: 'displayField', label: '显示字段', component: 'vxe-input' },
                              { field: 'displayValueField', label: '显示值目标字段', component: 'vxe-input' },
                              { field: 'searchField', label: '搜索字段', component: 'vxe-input' },
                              {
                                field: 'fieldMappings',
                                label: '字段映射',
                                component: 'lc-array-table',
                                span: 2,
                                props: {
                                  columns: [
                                    { field: 'sourceField', title: '来源字段', minWidth: 180 },
                                    { field: 'targetField', title: '目标表单字段', minWidth: 180 },
                                  ],
                                  defaultRow: { sourceField: '', targetField: '' },
                                  toolbarButtons: [
                                    { code: 'add', label: '新增映射', command: 'add', status: 'primary' },
                                  ],
                                },
                              },
                            ],
                            actions: [],
                          },
                        },
                      },
                      {
                        field: 'defaultValueType',
                        label: '默认值类型',
                        component: 'vxe-select',
                        options: [
                          { label: '无默认值', value: 'none' },
                          { label: '固定值', value: 'literal' },
                          { label: '函数', value: 'function' },
                        ],
                      },
                      { field: 'defaultValue', label: '默认值', component: 'vxe-input' },
                      {
                        field: 'optionsCode',
                        label: '关联下拉 Code',
                        component: 'vxe-select',
                        optionsCode: 'option_source_code',
                        props: {
                          clearable: true,
                          filterable: true,
                          allowCreate: true,
                          placeholder: '请选择或输入下拉 Code',
                        },
                      },
                      { field: 'validationMessage', label: '校验提示', component: 'vxe-input' },
                      { field: 'defaultValueScript', label: '默认值函数', component: 'vxe-textarea', span: 2 },
                      { field: 'updateScript', label: '值更新事件', component: 'vxe-textarea', span: 2 },
                      { field: 'validationScript', label: '校验函数', component: 'vxe-textarea', span: 2 },
                    ],
                    actions: [],
                  },
                }];
              }
            }
            return [];
          }
          if (serviceName === 'lowcode' && serviceMethod === 'listTablePageOptions') {
            return [];
          }
          if (serviceName === 'admin' && serviceMethod === 'resolveOptionItemsBatch') {
            return Object.fromEntries((payload.sourceCodes ?? []).map((code) => [
              code,
              {
                options: code === 'option_source_code'
                  ? [
                      { label: '订单编码 (order_code)', value: 'order_code' },
                      { label: '搜索关键字 (search_keyword)', value: 'search_keyword' },
                    ]
                  : code === 'form_field_component_type'
                    ? [
                        { label: '输入框', value: 'vxe-input' },
                        { label: '多行文本', value: 'vxe-textarea' },
                        { label: '下拉选择', value: 'vxe-select' },
                        { label: '关联资料', value: 'base-info' },
                      ]
                    : [],
                cacheTtlSeconds: 0,
              },
            ]));
          }
          if (serviceName === 'entityDesign' && serviceMethod === 'listDesign') {
            return { tables: [] };
          }
          if (serviceName !== 'lowcode' || serviceMethod !== 'saveItem') {
            throw new Error(`Unexpected service call: ${serviceName}.${serviceMethod}`);
          }

          saveCalls.push(structuredClone(payload));
          return {
            ...pageRecord,
            ...payload.data,
            schema: structuredClone(payload.data.schema),
          };
        },
      };

      const App = defineComponent({
        setup() {
          return () => h(LowCodePageRenderer, {
            ref: renderer,
            page: pageRecord,
            serviceApi,
            locale: 'zh-CN',
            route: {
              query: runtimeMode === 'edit' ? { id: 'existing-record' } : {},
              params: {},
              path: pageRecord.route,
              fullPath: pageRecord.route,
            },
          });
        },
      });

      const app = createApp(App);
      app.use(installVxeUI);
      app.use(VxeUITable);
      app.mount('#app');

      window.__runtimeFormDesignerSaveSmoke = {
        pageRecord,
        runtimeMode,
        saveCalls,
        snapshot() {
          return renderer.value?.getSnapshot?.() ?? null;
        },
      };

      await nextTick();
      document.querySelector('#result').textContent = JSON.stringify({ ok: true });
    </script>
  </body>
</html>
