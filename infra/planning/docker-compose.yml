name: enlearn-planning

services:
  frepple-sidecar:
    build:
      context: ../..
      dockerfile: infra/planning/Dockerfile
    image: enlearn/frepple-sidecar:9.17.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    ports:
      - ${PLANNING_SIDECAR_PUBLISH_IP:-127.0.0.1}:${PLANNING_SIDECAR_PORT:-8088}:8080
    environment:
      PLANNING_ENGINE_TOKEN: ${PLANNING_ENGINE_TOKEN:-}
      PLANNING_SIDECAR_TIMEOUT_SECONDS: ${PLANNING_SIDECAR_TIMEOUT_SECONDS:-3600}
      PLANNING_SIDECAR_CANCEL_GRACE_SECONDS: ${PLANNING_SIDECAR_CANCEL_GRACE_SECONDS:-2}
      PLANNING_SIDECAR_TEST_DELAY_SECONDS: ${PLANNING_SIDECAR_TEST_DELAY_SECONDS:-0}
      PLANNING_SIDECAR_MAX_REQUEST_BYTES: ${PLANNING_SIDECAR_MAX_REQUEST_BYTES:-268435456}
      PLANNING_SIDECAR_MAX_RESPONSE_BYTES: ${PLANNING_SIDECAR_MAX_RESPONSE_BYTES:-268435456}
      PLANNING_SIDECAR_MAX_LOG_BYTES: ${PLANNING_SIDECAR_MAX_LOG_BYTES:-10485760}
    networks:
      - planning

networks:
  planning:
    name: enlearn-planning
